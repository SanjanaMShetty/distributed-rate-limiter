name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and scan source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Validate Helm chart
        run: |
          helm lint deploy/k8s/helm/distributed-rate-limiter
          helm template rate-limiter deploy/k8s/helm/distributed-rate-limiter \
            --namespace rate-limiter --set autoscaling.enabled=true > /tmp/rate-limiter-hpa.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/rate-limiter-hpa.yaml

      - name: Scan source and Kubernetes configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.2
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image-scan:
    name: Build and scan container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build container image
        run: docker build --tag distributed-rate-limiter:${GITHUB_SHA} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: distributed-rate-limiter:${{ github.sha }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save scanned image artifact
        run: docker save --output rate-limiter-image.tar distributed-rate-limiter:${GITHUB_SHA}

      - name: Upload scanned image artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rate-limiter-image-${{ github.sha }}
          path: rate-limiter-image.tar
          retention-days: 1

  publish-image:
    name: Publish scanned image
    needs: image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned image artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rate-limiter-image-${{ github.sha }}

      - name: Load scanned image
        run: docker load --input rate-limiter-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable commit image to GHCR
        env:
          IMAGE: ghcr.io/sanjanamshetty/distributed-rate-limiter
          TAG: sha-${{ github.sha }}
        run: |
          docker tag "distributed-rate-limiter:${GITHUB_SHA}" "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${TAG}"
