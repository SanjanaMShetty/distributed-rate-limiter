services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-config", "/etc/toxiproxy/toxiproxy.json", "-host", "0.0.0.0"]
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    depends_on:
      redis:
        condition: service_healthy

  gateway-a:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: toxiproxy:6379
      LIMIT_RULES_FILE: /etc/rate-limiter/rules.json
      REDIS_TIMEOUT: 10ms
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./rules.json:/etc/rate-limiter/rules.json:ro
    ports:
      - "8080:8080"
    depends_on:
      toxiproxy:
        condition: service_started

  gateway-b:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: toxiproxy:6379
      LIMIT_RULES_FILE: /etc/rate-limiter/rules.json
      REDIS_TIMEOUT: 10ms
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./rules.json:/etc/rate-limiter/rules.json:ro
    ports:
      - "8081:8080"
    depends_on:
      toxiproxy:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - gateway-a
      - gateway-b

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
