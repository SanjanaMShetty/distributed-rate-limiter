global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-a:8080", "gateway-b:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
