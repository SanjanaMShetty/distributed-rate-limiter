{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distributed-rate-limiter.fullname" . }}-redis
  labels:
    {{- include "distributed-rate-limiter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distributed-rate-limiter.redisSelector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "distributed-rate-limiter.gatewaySelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
{{- end }}
