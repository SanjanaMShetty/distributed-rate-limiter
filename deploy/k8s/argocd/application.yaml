apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distributed-rate-limiter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SanjanaMShetty/distributed-rate-limiter.git
    targetRevision: main
    path: deploy/k8s/helm/distributed-rate-limiter
    helm:
      valueFiles:
        - values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rate-limiter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
